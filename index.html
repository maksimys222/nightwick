<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Фонарщик</title>
  </head>
  <body data-scene="room">
    <div id="screen"></div>
    <div id="sky" hidden>
      <div id="sun"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div>
    </div>
    <div id="bubble" hidden></div>
    <div id="hud">
      <div class="res" title="Свет — главная валюта. Дают горящие фонари. Тратится на улучшения в мастерской."><i class="ic sun"></i><span class="lbl">Свет</span><b id="lumens">0</b><small id="rate"></small></div>
      <div class="res night-only" title="Свет, собранный за ночь. Сохранится, только если донести его до дома."><i class="ic carry"></i><span class="lbl">В фонаре</span><b id="carry">0</b></div>
      <div class="res night-only" title="Масло — топливо для уличных фонарей. Делается из семечек на маслобойне."><i class="ic oil"></i><span class="lbl">Масло</span><b id="oil">0</b></div>
      <div class="res night-only" title="Семечки — с цветущих подсолнухов. Отнеси на маслобойню: 1 семечко = 1 масло."><i class="ic seed"></i><span class="lbl">Семечки</span><b id="seeds">0</b></div>
      <div id="ready" class="ready" hidden>Награда на доске!</div>
      <button id="guide-btn" hidden>Дневник [F1]<span id="journal-new" hidden> ●</span></button>
    </div>
    <div id="top">
      <div id="timer" hidden>
        <span class="t-lbl">Фонарь</span>
        <div class="t-bar"><div id="timer-fill"></div></div>
        <span id="timer-text">0:00</span>
      </div>
      <div id="goal"></div>
    </div>
    <div id="prompt" hidden></div>
    <div id="holdbar"><div id="holdfill"></div></div>
    <div id="toasts"></div>
    <div id="dialog" hidden>
      <div id="dlg-who"></div>
      <div id="dlg-text"></div>
      <div class="dlg-hint">E — дальше</div>
    </div>
    <div id="modal" hidden>
      <div class="modal-box">
        <button id="modal-close" title="Закрыть (Esc)">×</button>
        <h2 id="modal-title"></h2>
        <div id="modal-sub"></div>
        <div id="modal-lumens"></div>
        <div id="modal-body"></div>
      </div>
    </div>
    <div id="fade"></div>
    <button id="skip" hidden>Пропустить</button>
    <div id="talk" hidden><div id="talk-who"></div><div id="talk-text"></div></div>
    <div id="menu" hidden>
      <div class="menu-box">
        <h1 id="menu-title">Фонарщик</h1>
        <div class="menu-sub">Зажги свет в вечной ночи</div>
        <div id="menu-main" class="menu-list"></div>
        <div id="menu-settings" class="menu-list" hidden>
          <label class="vol">Громкость <input type="range" id="vol" min="0" max="100" /></label>
          <button data-m="back">Назад</button>
        </div>
      </div>
    </div>
    <div id="keys">WASD — идти · E — действие (зажми) · F1 — дневник · Esc — меню</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
